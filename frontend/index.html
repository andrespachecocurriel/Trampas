<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red de Trampas - Encuesta Online</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1><i class="fas fa-map-location-dot"></i> Red de Trampas</h1>
            <p>Sistema de registro de trampas con geolocalización</p>
        </header>

        <main class="main-content">
            <!-- Formulario -->
            <section class="form-section">
                <h2>Registrar Nueva Trampa</h2>
                <form id="encuestaForm" class="encuesta-form">
                    
                    <!-- Fila 1: Usuario y Tipo de Trampa -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="usuario">
                                <i class="fas fa-user"></i> Nombre del Usuario
                            </label>
                            <input type="text" id="usuario" name="usuario" placeholder="Tu nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="tipo_trampa">
                                <i class="fas fa-cube"></i> Tipo de Trampa
                            </label>
                            <select id="tipo_trampa" name="tipo_trampa" required>
                                <option value="">Selecciona un tipo</option>
                                <option value="Ratonera">Ratonera</option>
                                <option value="Trampa Viva">Trampa Viva</option>
                                <option value="Red">Red</option>
                                <option value="Jaula">Jaula</option>
                                <option value="Otra">Otra</option>
                            </select>
                        </div>
                    </div>

                    <!-- Fila 2: Estado y Descripción -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="estado">
                                <i class="fas fa-circle-check"></i> Estado
                            </label>
                            <select id="estado" name="estado" required>
                                <option value="">Selecciona estado</option>
                                <option value="Activa">Activa</option>
                                <option value="Inactiva">Inactiva</option>
                                <option value="Disparada">Disparada</option>
                                <option value="Mantenimiento">Mantenimiento</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="descripcion">
                                <i class="fas fa-pen"></i> Descripción
                            </label>
                            <textarea id="descripcion" name="descripcion" placeholder="Detalles adicionales" rows="2"></textarea>
                        </div>
                    </div>

                    <!-- Sección de Geolocalización -->
                    <div class="geolocation-section">
                        <h3><i class="fas fa-location-crosshairs"></i> Geolocalización</h3>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="latitud">Latitud</label>
                                <input type="number" id="latitud" name="latitud" placeholder="4.7110" step="0.0001" readonly>
                            </div>
                            <div class="form-group">
                                <label for="longitud">Longitud</label>
                                <input type="number" id="longitud" name="longitud" placeholder="-74.0721" step="0.0001" readonly>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="utm_zone">Zona UTM</label>
                                <input type="text" id="utm_zone" name="utm_zone" placeholder="18M" readonly>
                            </div>
                            <div class="form-group">
                                <label for="utm_este">Este (E)</label>
                                <input type="number" id="utm_este" name="utm_este" placeholder="1000000" readonly>
                            </div>
                            <div class="form-group">
                                <label for="utm_norte">Norte (N)</label>
                                <input type="number" id="utm_norte" name="utm_norte" placeholder="500000" readonly>
                            </div>
                        </div>

                        <button type="button" id="btnGeolocalizacion" class="btn-geo">
                            <i class="fas fa-satellite"></i> Obtener Mi Ubicación
                        </button>
                        <div id="geoStatus" class="status-message"></div>
                    </div>

                    <!-- Foto -->
                    <div class="form-group">
                        <label for="foto">
                            <i class="fas fa-camera"></i> Foto (opcional)
                        </label>
                        <input type="file" id="foto" name="foto" accept="image/*">
                        <div id="preview-foto" class="preview-foto"></div>
                    </div>

                    <!-- Botones de acción -->
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-floppy-disk"></i> Guardar Encuesta
                        </button>
                        <button type="reset" class="btn btn-secondary">
                            <i class="fas fa-rotate-left"></i> Limpiar
                        </button>
                    </div>
                </form>
            </section>

            <!-- Mapa -->
            <section class="map-section">
                <h2><i class="fas fa-map"></i> Mapa de Ubicación</h2>
                <div id="map" class="map-container"></div>
            </section>

            <!-- Estado de carga -->
            <div id="loadingMessage" class="loading-message" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i> Cargando datos...
            </div>
        </main>

        <!-- Toast de notificaciones -->
        <div id="toast" class="toast"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <!-- UTM Library -->
    <script src="https://cdn.jsdelivr.net/npm/utm@0.0.10/index.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/utm-converter.js"></script>
    <script src="js/geolocation.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
